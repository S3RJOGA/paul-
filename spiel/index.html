<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paul's Schlafzimmer-Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }
    #gameCanvas {
      border: 3px solid #4fc3f7;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(79,195,247,0.4);
      display: block;
      /* Größe wird komplett per JS gesetzt */
    }
    #controls {
      position: fixed;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      color: #aaa;
      font-size: 12px;
    }
    /* ── Touch-Buttons ─────────────────────────── */
    #touchControls {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      pointer-events: none;
      z-index: 10;
    }
    .tBtn {
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(79,195,247,0.20);
      border: 3px solid rgba(79,195,247,0.55);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      color: #fff;
      pointer-events: all;
      -webkit-tap-highlight-color: transparent;
    }
    .tBtn.pressed { background: rgba(79,195,247,0.50); }
    #btnLeft  { bottom: 20px; left:  18px; }
    #btnRight { bottom: 20px; left: 112px; }
    #btnJump  { bottom: 15px; right: 18px; width: 90px; height: 90px; font-size: 34px; }
    @media (pointer: coarse) {
      #touchControls { display: block; }
      #controls      { display: none;  }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    ← → Bewegen &nbsp;|&nbsp; ↑ / Leertaste Springen &nbsp;|&nbsp; Ziel: Alle Sterne sammeln &amp; das Bett erreichen!
  </div>
  <div id="touchControls">
    <div class="tBtn" id="btnLeft">◀</div>
    <div class="tBtn" id="btnRight">▶</div>
    <div class="tBtn" id="btnJump">🅰</div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  PAUL'S SCHLAFZIMMER-ABENTEUER  –  Mario-ähnliches 2D Jump & Run
//  Struktur:  1) Canvas & States  2) Assets  3) Level-Daten
//             4) Update-Logik    5) Draw-Logik  6) HUD & Screens
//             7) Game Loop
// ═══════════════════════════════════════════════════════════════════════

// ─────────────────────────────────────────────
// 1. CANVAS & GAME STATES
// ─────────────────────────────────────────────
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
canvas.width  = 800;
canvas.height = 500;

const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
let gameState = STATE.START;

// ─────────────────────────────────────────────
// 2. KONSTANTEN & PHYSIK
// ─────────────────────────────────────────────
const GRAVITY      = 0.55;   // Schwerkraft pro Frame
const PLAYER_SPEED = 4.2;    // Horizontale Geschwindigkeit
const JUMP_FORCE   = -13;    // Sprungkraft (negativ = nach oben)
const WORLD_WIDTH  = 4200;   // Gesamtbreite der Spielwelt
const INVINCIBLE_FRAMES = 120; // ~2 Sek. Unverwundbarkeit nach Treffer

// Falltür – Position kurz vor dem Bett
const TRAP_X = 3630, TRAP_W = 160, TRAP_Y = 450;

// Unterirdischer Raum
const ROOM = { x: 3300, y: 510, w: 700, h: 310, floorY: 820 };

// Kamera-Offsets (horizontal + vertikal)
let cameraX = 0;
let cameraY = 0;
let showBossHint = 0; // Frames wie lange der Hinweis sichtbar bleibt

// ─────────────────────────────────────────────
// 3. INPUT
// ─────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  // Screen-Übergänge per Leertaste
  if (e.code === 'Space') {
    if (gameState === STATE.START)    { gameState = STATE.PLAYING; startMusic(); }
    else if (gameState === STATE.GAMEOVER || gameState === STATE.WIN) {
      fullReset(); gameState = STATE.PLAYING; startMusic();
    }
    e.preventDefault();
  }
});
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// Tap auf Canvas startet/startet neu (Start- & Game-Over-Screen)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === STATE.START)                              { gameState = STATE.PLAYING; startMusic(); }
  else if (gameState === STATE.GAMEOVER || gameState === STATE.WIN) { fullReset(); gameState = STATE.PLAYING; startMusic(); }
}, { passive: false });

// ── Touch-Steuerung ────────────────────────────────────────────────
const touch = { left: false, right: false, jump: false };
function bindBtn(id, prop) {
  const el = document.getElementById(id);
  if (!el) return;
  const press   = e => { e.preventDefault(); touch[prop] = true;  el.classList.add('pressed'); };
  const release = e => { e.preventDefault(); touch[prop] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart',  press,   { passive: false });
  el.addEventListener('touchend',    release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  // auch Maus-Klick für Desktop-Test
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup',   release);
}
bindBtn('btnLeft',  'left');
bindBtn('btnRight', 'right');
bindBtn('btnJump',  'jump');

// Canvas automatisch skalieren (Desktop & Handy)
function resizeCanvas() {
  const isTouch  = window.matchMedia('(pointer: coarse)').matches;
  const padBot   = isTouch ? 128 : 24;          // Platz für Touch-Buttons
  const availW   = window.innerWidth   - 4;     // leichter Rand
  const availH   = window.innerHeight  - padBot;
  const scale    = Math.min(availW / 800, availH / 500, 1); // nie größer als Original
  canvas.style.width  = Math.round(800 * scale) + 'px';
  canvas.style.height = Math.round(500 * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─────────────────────────────────────────────
// 4. ASSETS  (Paul-Bild & Sound)
// ─────────────────────────────────────────────
const paulImg    = new Image();
paulImg.src      = 'Paul.png';   // liegt im selben Ordner /spiel/

const bingSound  = new Audio('bing.wav');
function playBing() {
  bingSound.currentTime = 0;
  bingSound.play().catch(() => {});
}

const offSound = new Audio('off.wav');
function playOff() {
  offSound.currentTime = 0;
  offSound.play().catch(() => {});
}

const finishSound = new Audio('finish.wav');
function playFinish() {
  finishSound.currentTime = 0;
  finishSound.play().catch(() => {});
}

const bgMusic = new Audio('background.wav');
bgMusic.loop   = true;
bgMusic.volume = 0.4;
function startMusic() {
  if (bgMusic.paused) bgMusic.play().catch(() => {});
}
function stopMusic() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
}

// ─────────────────────────────────────────────
// 5. SPIELER-OBJEKT
// ─────────────────────────────────────────────
const NORMAL_W = 46, NORMAL_H = 64;
const BIG_W    = 69, BIG_H    = 96;  // 1.5× Größe
const BIG_DURATION = 420;            // ~7 Sekunden bei 60 fps

const player = {
  x: 80, y: 370,
  w: NORMAL_W, h: NORMAL_H,
  vx: 0, vy: 0,
  onGround:     false,
  facingRight:  true,
  invincible:   false,
  invTimer:     0,
  jumpPressed:  false,
  lives:  3,
  score:  0,
  big:       false,
  bigTimer:  0,

  growBig() {
    if (!this.big) {
      // Fußpunkt beibehalten beim Vergrößern
      this.y -= (BIG_H - this.h);
    }
    this.big = true; this.bigTimer = BIG_DURATION;
    this.w = BIG_W;  this.h = BIG_H;
  },
  shrink() {
    // Fußpunkt beibehalten beim Verkleinern
    this.y += (this.h - NORMAL_H);
    this.big = false; this.bigTimer = 0;
    this.w = NORMAL_W; this.h = NORMAL_H;
  },

  // Nur Position zurücksetzen (nach Treffer)
  respawn() {
    this.x = 80; this.y = 370;
    this.vx = 0; this.vy = 0;
    this.onGround = false;
    this.invincible = true;
    this.invTimer   = INVINCIBLE_FRAMES;
    this.big = false; this.bigTimer = 0;
    this.w = NORMAL_W; this.h = NORMAL_H;
  },
  // Kompletter Reset (neues Spiel)
  fullReset() {
    this.respawn();
    this.lives = 3; this.score = 0;
    this.invincible = false; this.invTimer = 0;
  }
};

let energyDrinks = [];

function fullReset() {
  player.fullReset();
  cameraX = 0; cameraY = 0;
  showBossHint = 0;
  energyDrinks = [];
  initCollectibles();
  initEnemies();
  resetBossRoom();
}

// ─────────────────────────────────────────────
// 6. LEVEL-DATEN  – Plattformen

  // ── Spielzeug-Plattformen (linkes Drittel) ─────────────────────────
  // Alle Plattformen y < 336, damit big Paul (h=96, Kopf bei y=354) darunter passt

  { x:  415, y: 270, w: 110, h: 18, type: 'block' },
  { x:  620, y: 320, w:  90, h: 18, type: 'toy'   },
  { x:  830, y: 285, w: 115, h: 18, type: 'block' },
  { x: 1060, y: 310, w:  95, h: 18, type: 'toy'   },
  { x: 1265, y: 255, w: 110, h: 18, type: 'block' },
  { x: 1480, y: 320, w: 110, h: 18, type: 'toy'   },

  // ── Mittleres Drittel ──────────────────────────────────────────────
  { x: 1700, y: 285, w: 105, h: 18, type: 'block' },
  { x: 1920, y: 315, w: 125, h: 18, type: 'toy'   },
  { x: 2155, y: 250, w: 110, h: 18, type: 'block' },
  { x: 2370, y: 320, w:  95, h: 18, type: 'toy'   },
  { x: 2580, y: 280, w: 115, h: 18, type: 'block' },
  { x: 2810, y: 315, w:  85, h: 18, type: 'toy'   },
  { x: 3005, y: 265, w: 110, h: 18, type: 'block' },

  // ── Letztes Drittel ────────────────────────────────────────────────
  { x: 3225, y: 315, w:  90, h: 18, type: 'toy'   },
  { x: 3430, y: 275, w: 110, h: 18, type: 'block' },
  { x: 3610, y: 315, w:  85, h: 18, type: 'toy'   },   // knapp vor der Falltür

  // ── Ziel-Plattform: das Bett ────────────────────────────────────────
  { x: 3800, y: 385, w: 260, h: 65, type: 'bed'   },
];

// ─────────────────────────────────────────────
// 7. GEGNER  – Puppen & Spielzeugautos
// ─────────────────────────────────────────────
// Jeder Gegner: { x, y, w, h, vx, type, patrol: {left, right} | null }
let enemies = [];

function initEnemies() {
  enemies = [
    // ── Boden-Patrouille (nur 4 Stück, gleichmäßig verteilt) ────────
    { x:  820, y: 405, w: 36, h: 45, vx:  1.4, type:'doll',  patrol:{ l: 650,  r: 980  } },
    { x: 1620, y: 410, w: 42, h: 40, vx: -1.4, type:'car',   patrol:{ l: 1440, r: 1750 } },
    { x: 2650, y: 405, w: 36, h: 45, vx:  1.4, type:'doll',  patrol:{ l: 2480, r: 2820 } },
    { x: 3320, y: 410, w: 42, h: 40, vx: -1.4, type:'car',   patrol:{ l: 3140, r: 3490 } },

    // ── Plattform-Patrouille (nur 3 Stück) ──────────────────────────
    // y = platform.y - enemy.h  (exakt auf der Plattform stehend)
    { x: 1265, y: 213, w: 34, h: 42, vx:  1.0, type:'doll',  patrol:{ l: 1265, r: 1341 } },
    { x: 2155, y: 208, w: 34, h: 42, vx:  1.0, type:'doll',  patrol:{ l: 2155, r: 2231 } },
    { x: 3430, y: 233, w: 34, h: 42, vx: -1.0, type:'doll',  patrol:{ l: 3430, r: 3496 } }, // Blockplattform y=275
  ];
}
initEnemies();

// ─────────────────────────────────────────────
// 7b. FALLTÜR, RAUM, MINIBOSS, FEDER
// ─────────────────────────────────────────────

// Falltür-Zustand
const trapdoor = {
  x: TRAP_X, y: TRAP_Y, w: TRAP_W, h: 50,
  state: 'closed',  // 'closed' | 'shaking' | 'falling' | 'open'
  timer: 0, shakeOff: 0,
  leftDrop: 0, rightDrop: 0,
};

// Raum-Kollisions-Plattformen (Wände + Boden)
const roomPlats = [
  { x: ROOM.x - 28,        y: ROOM.y,      w: 28, h: ROOM.h + 30, type: 'wall' },
  { x: ROOM.x + ROOM.w,    y: ROOM.y,      w: 28, h: ROOM.h + 30, type: 'wall' },
  { x: ROOM.x - 28,        y: ROOM.floorY, w: ROOM.w + 56, h: 30, type: 'floor' },
];

// Miniboss – wütender Teddybär
let boss = null;
function initBoss() {
  boss = {
    x: ROOM.x + 30,           // weit links – Paul fällt mittig rein, kein Sofort-Overlap
    y: ROOM.floorY - 92,
    w: 70, h: 92,
    vx: 2.2,
    health: 3, maxHealth: 3,
    dead: false,
    activated: false,        // wird erst true wenn Paul gelandet ist

  };
}
initBoss();

// Feder (erscheint nach Boss-Sieg)
const exitSpring = {
  x: ROOM.x + ROOM.w / 2 - 22, y: ROOM.floorY - 22,
  w: 44, h: 22, active: false,
};

function resetBossRoom() {
  initBoss();
  trapdoor.state = 'closed';
  trapdoor.timer = 0; trapdoor.shakeOff = 0;
  trapdoor.leftDrop = 0; trapdoor.rightDrop = 0;

}

// ─────────────────────────────────────────────
// 8. COLLECTIBLES  – goldene Sterne
// ─────────────────────────────────────────────
let collectibles = [];

function initCollectibles() {
  collectibles = [];
  // [weltX, weltY] – Sterne über Plattformen und auf dem Boden
  const pts = [
    250,380, 330,380, 410,310, 490,380, 570,390,
    645,380, 740,320, 820,380, 930,380, 1000,380,
    1060,295, 1140,380, 1250,380, 1410,325, 1490,380,
    1590,365, 1660,380, 1760,285, 1840,380, 1940,380,
    2000,380, 2100,315, 2180,380, 2290,380, 2440,305,
    2520,380, 2650,380, 2780,315, 2860,380, 2970,380,
    3100,290, 3190,380, 3290,380, 3440,335, 3530,380,
    3640,380, 3730,380
  ];
  for (let i = 0; i < pts.length; i += 2) {
    collectibles.push({
      x: pts[i], y: pts[i+1] - 20,
      w: 18, h: 18,

      phase: Math.random() * Math.PI * 2  // für Bob-Animation
    });
  }
}
initCollectibles();

// ─────────────────────────────────────────────
// 9. ZIEL  – Flagge am Bett
// ─────────────────────────────────────────────
const goal = { x: 3840, y: 310, w: 44, h: 75 };

// ─────────────────────────────────────────────
// 10. HILFSFUNKTIONEN
// ─────────────────────────────────────────────
// Achsen-ausgerichtete Kollision (AABB)
function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// Farbe aufhellen/abdunkeln (amount: positiv=heller, negativ=dunkler)
function shadeColor(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (n & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// Stern-Pfad zeichnen
function drawStar(cx, cy, spikes, ro, ri) {
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const r   = (i % 2 === 0) ? ro : ri;
    ctx.lineTo(cx + Math.cos(rot) * r, cy + Math.sin(rot) * r);
    rot += step;
  }
  ctx.closePath();
}

// Einfache abgerundete Rechtecke (Hilfsfunktion)
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w,     y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x,     y + h, x,         y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x,     y,     x + r,     y);
  ctx.closePath();
}

// ─────────────────────────────────────────────
// 11. UPDATE-LOGIK
// ─────────────────────────────────────────────
function update() {
  if (gameState !== STATE.PLAYING) return;

  // ── Spieler-Input ──────────────────────────
  const goLeft  = keys['ArrowLeft']  || keys['KeyA'] || touch.left;
  const goRight = keys['ArrowRight'] || keys['KeyD'] || touch.right;
  const jumpKey = keys['ArrowUp']    || keys['KeyW'] || keys['Space'] || touch.jump;

  if (goLeft)       { player.vx = -PLAYER_SPEED; player.facingRight = false; }
  else if (goRight) { player.vx =  PLAYER_SPEED; player.facingRight = true;  }
  else              { player.vx *= 0.75; } // Reibung

  // Springen (nur wenn am Boden, nur einmal pro Druck)
  if (jumpKey && player.onGround && !player.jumpPressed) {
    player.vy = JUMP_FORCE;
    player.jumpPressed = true;
    player.onGround = false;
    playBing();
  }
  if (!jumpKey) player.jumpPressed = false;

  // Schwerkraft
  player.vy += GRAVITY;
  if (player.vy > 18) player.vy = 18; // Fallgeschwindigkeits-Limit

  // ── Horizontale Bewegung + Kollision ───────
  player.x += player.vx;
  if (player.x < 0)                       player.x = 0;
  if (player.x + player.w > WORLD_WIDTH)  player.x = WORLD_WIDTH - player.w;

  for (const p of platforms) {
    if (overlaps(player, p)) {
      if (player.vx > 0) { player.x = p.x - player.w; }
      else               { player.x = p.x + p.w; }
      player.vx = 0;
    }
  }

  // ── Vertikale Bewegung + Kollision ─────────
  player.y += player.vy;
  player.onGround = false;

  for (const p of platforms) {
    if (overlaps(player, p)) {
      if (player.vy >= 0) {
        // Von oben auf Plattform gelandet
        player.y       = p.y - player.h;
        player.vy      = 0;
        player.onGround = true;
      } else {
        // Kopf stößt an Plattform von unten
        player.y  = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // Vom Bildschirm gefallen? (Grenze weit unterhalb des Raum-Bodens)
  if (player.y > ROOM.floorY + 120) { loseLife(); return; }

  // ── Unverwundbarkeits-Timer ─────────────────
  if (player.invincible) {
    player.invTimer--;
    if (player.invTimer <= 0) player.invincible = false;
  }

  // ── Gegner bewegen & Kollision ──────────────
  for (const e of enemies) {
    if (e.dead) continue; // Tote Gegner überspringen

    e.x += e.vx;
    // Patrouille umkehren
    if (e.x <= e.patrol.l)       { e.x = e.patrol.l; e.vx =  Math.abs(e.vx); }
    if (e.x + e.w >= e.patrol.r) { e.x = e.patrol.r - e.w; e.vx = -Math.abs(e.vx); }

    // Puppen bekommen eine kleinere Hitbox (visuell gleich, Kollision enger)
    const eHit = e.type === 'doll'
      ? { x: e.x + 7, y: e.y + 9, w: e.w - 14, h: e.h - 12 }
      : e;

    if (!player.invincible && overlaps(player, eHit)) {
      // Von oben draufgesprungen? (Spieler fällt, Füße über Mitte des Gegners)
      const stomping = player.vy > 0 &&
                       player.y + player.h < e.y + e.h * 0.6;
      if (stomping) {
        e.dead = true;           // Gegner stirbt
        player.vy = -8;          // kleiner Abprall nach oben
        player.score += 20;      // Bonuspunkte
        // Nur Kuscheltiere (dolls) lassen Energy Drink fallen
        if (e.type === 'doll') {
          energyDrinks.push({
            x: e.x + e.w / 2 - 10, y: e.y - 10,
            w: 20, h: 32,
            collected: false,
            phase: Math.random() * Math.PI * 2
          });
        }
      } else if (player.big) {
        // Groß → nur schrumpfen statt sterben
        playOff();
        player.shrink();
        player.invincible = true;
        player.invTimer   = INVINCIBLE_FRAMES;
      } else {
        loseLife();
        return;
      }
    }
  }

  // ── Big-Timer ablaufen lassen ───────────────
  if (player.big) {
    player.bigTimer--;
    if (player.bigTimer <= 0) player.shrink();
  }

  // ── Energy Drinks einsammeln ────────────────
  for (const d of energyDrinks) {
    if (!d.collected && overlaps(player, d)) {
      d.collected = true;
      player.growBig();
    }
  }

  // ── Sterne einsammeln ──────────────────────
  for (const c of collectibles) {
    if (!c.collected && overlaps(player, c)) {
      c.collected = true;
      player.score += 10;
    }
  }

  // ── Ziel erreicht? (nur wenn Boss besiegt) ──
  if (overlaps(player, goal)) {
    if (boss && boss.dead) {
      stopMusic(); playFinish(); gameState = STATE.WIN;
    } else {
      // Boss noch nicht besiegt – Hinweis anzeigen
      player.vx = 0;  // kurz abbremsen
      showBossHint = 180; // ~3 Sek. Hinweistext
    }
  }

  // ── Falltür-Kollision (wenn geschlossen/schüttelt) ─
  if (trapdoor.state === 'closed' || trapdoor.state === 'shaking') {
    const td = { x: trapdoor.x, y: trapdoor.y, w: trapdoor.w, h: trapdoor.h };
    if (overlaps(player, td)) {
      if (player.vy >= 0 && player.y + player.h <= trapdoor.y + 10) {
        player.y = trapdoor.y - player.h;
        player.vy = 0; player.onGround = true;
      }
    }
    // Spieler betritt Falltür → Schütteln starten
    if (trapdoor.state === 'closed' && player.onGround &&
        player.x + player.w > trapdoor.x && player.x < trapdoor.x + trapdoor.w) {
      trapdoor.state = 'shaking';
      trapdoor.timer = 80;
    }
  }

  // ── Falltür-Animation ──────────────────────
  if (trapdoor.state === 'shaking') {
    trapdoor.timer--;
    trapdoor.shakeOff = Math.sin(trapdoor.timer * 1.2) * 4;
    if (trapdoor.timer <= 0) {
      trapdoor.state = 'falling'; trapdoor.timer = 50;
      // Paul ist während des gesamten Falls unverwundbar
      player.invincible = true;
      player.invTimer   = INVINCIBLE_FRAMES * 3; // ~6 Sekunden – reicht für Fall + Landing
    }
  } else if (trapdoor.state === 'falling') {
    trapdoor.timer--;
    trapdoor.leftDrop  += 5;
    trapdoor.rightDrop += 6;
    if (trapdoor.timer <= 0) trapdoor.state = 'open';
  }

  // ── Raum-Kollision (Swept-Check gegen Tunneling) ─
  for (const p of roomPlats) {
    if (!overlaps(player, p)) continue;
    const prevBottom = player.y + player.h - player.vy;
    const prevTop    = player.y            - player.vy;
    const prevRight  = player.x + player.w - player.vx;
    const prevLeft   = player.x            - player.vx;
    if (player.vy >= 0 && prevBottom <= p.y + 4) {
      player.y = p.y - player.h; player.vy = 0; player.onGround = true;
    } else if (player.vy < 0 && prevTop >= p.y + p.h - 4) {
      player.y = p.y + p.h; player.vy = 0;
    } else if (player.vx > 0 && prevRight <= p.x + 4) {
      player.x = p.x - player.w; player.vx = 0;
    } else if (player.vx < 0 && prevLeft >= p.x + p.w - 4) {
      player.x = p.x + p.w; player.vx = 0;
    } else {
      // Fallback: Paul steckt tief im Boden – einfach nach oben setzen
      player.y = p.y - player.h; player.vy = 0; player.onGround = true;
    }
  }

  // ── Miniboss ───────────────────────────────
  if (boss && !boss.dead && trapdoor.state === 'open') {
    // Boss erst aktivieren wenn Paul auf dem Raum-Boden steht
    if (!boss.activated && player.onGround && player.y + player.h >= ROOM.floorY - 4) {
      boss.activated = true;
      // Kurze Unverwundbarkeit beim Landen – kein Sofort-Schaden
      player.invincible = true;
      player.invTimer   = INVINCIBLE_FRAMES;
    }

    if (boss.activated) {
      boss.x += boss.vx;
      if (boss.x <= boss.patrol.l) { boss.x = boss.patrol.l; boss.vx =  Math.abs(boss.vx); }
      if (boss.x + boss.w >= boss.patrol.r) { boss.x = boss.patrol.r - boss.w; boss.vx = -Math.abs(boss.vx); }
      if (boss.invincible) { boss.invTimer--; if (boss.invTimer <= 0) boss.invincible = false; }
    }

    if (boss.activated && !player.invincible && overlaps(player, boss)) {
      const stomping = player.vy > 0 && player.y + player.h < boss.y + boss.h * 0.38;
      if (stomping && !boss.invincible) {
        boss.health--;
        boss.invincible = true; boss.invTimer = 55;
        player.vy = -9;
        playBing();
        if (boss.health <= 0) {
          boss.dead = true;
          exitSpring.active = true;
          player.score += 150;
        }
      } else if (!stomping) {
        if (player.big) {
          playOff(); player.shrink();
          player.invincible = true; player.invTimer = INVINCIBLE_FRAMES;
        } else { loseLife(); return; }
      }
    }
  }

  // ── Feder (Ausgang nach Boss-Sieg) ─────────
  if (exitSpring.active && player.vy >= 0 && overlaps(player, exitSpring)) {
    player.vy = -24; // Katapult nach oben!
    playBing();
  }

  // ── Kamera folgt Spieler (X + Y) ───────────
  const targetCamX = player.x - canvas.width * 0.35;
  cameraX = Math.max(0, Math.min(targetCamX, WORLD_WIDTH - canvas.width));
  const targetCamY = player.y - canvas.height * 0.5;
  cameraY = Math.max(0, targetCamY);
}

// Leben verlieren
function loseLife() {
  playOff();
  player.lives--;
  if (player.lives <= 0) {
    stopMusic();
    gameState = STATE.GAMEOVER;
  } else {
    player.respawn();
    cameraX = 0;
  }
}

// ─────────────────────────────────────────────
// 12. DRAW-LOGIK
// ─────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ── Welt zeichnen (verschoben durch Kamera) ─
  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  drawBackground();
  drawRoom();
  drawTrapdoor();
  drawPlatforms();
  drawCollectibles();
  drawEnergyDrinks();
  drawGoalFlag();
  drawEnemies();
  drawBoss();
  drawExitSpring();
  drawPlayer();

  ctx.restore();

  // ── HUD (immer im Screen-Koordinatensystem) ─
  drawHUD();

  // ── Overlay-Bildschirme ─────────────────────
  if (gameState === STATE.START)    drawStartScreen();
  if (gameState === STATE.GAMEOVER) drawGameOverScreen();
  if (gameState === STATE.WIN)      drawWinScreen();
}

  const t = Date.now() / 1000;

  // Himmelblaue Tapete
  ctx.fillStyle = '#cce8f5';
  ctx.fillRect(0, 0, WORLD_WIDTH, 450);

  // Tapetenstreifen oben
  ctx.fillStyle = '#b8dff0';
  ctx.fillRect(0, 0, WORLD_WIDTH, 14);
  ctx.fillStyle = '#ffe0ec';
  ctx.fillRect(0, 14, WORLD_WIDTH, 8);

  // Tapetenmuster – kleine Sterne
  ctx.fillStyle = 'rgba(255,215,0,0.22)';
  for (let wx = 30; wx < WORLD_WIDTH; wx += 70) {
    for (let wy = 35; wy < 420; wy += 70) {
      drawStar(wx, wy, 5, 8, 4);
      ctx.fill();
    }
  }

  // 3D Holzboden – einzelne Dielen mit Tiefenwirkung
  for (let wx = 0; wx < WORLD_WIDTH; wx += 110) {
    // Diele mit Gradient (oben hell, unten dunkel)
    const pg = ctx.createLinearGradient(0, 450, 0, 500);
    pg.addColorStop(0,   '#daa868');
    pg.addColorStop(0.15,'#c8955a');
    pg.addColorStop(0.85,'#9a7038');
    pg.addColorStop(1,   '#7a5228');
    ctx.fillStyle = pg;
    ctx.fillRect(wx, 450, 109, 50);
    // Highlight-Kante oben
    ctx.fillStyle = 'rgba(255,225,170,0.55)';
    ctx.fillRect(wx + 1, 450, 108, 3);
    // Schatten unten
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(wx + 1, 495, 108, 5);
    // Trennlinie (Dielenfuge)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(wx, 450, 2, 50);
    // Maserungslinien
    ctx.strokeStyle = 'rgba(255,200,130,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(wx + 25, 453); ctx.lineTo(wx + 22, 498); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx + 65, 452); ctx.lineTo(wx + 68, 498); ctx.stroke();
  }
  // Fußleiste (obere Kante Boden / Wand-Übergang)
  ctx.fillStyle = '#b88040';
  ctx.fillRect(0, 448, WORLD_WIDTH, 5);
  ctx.fillStyle = 'rgba(255,230,180,0.4)';
  ctx.fillRect(0, 448, WORLD_WIDTH, 2);

  // Schlafzimmer-Dekoration wiederholen
  for (let i = 0; i < WORLD_WIDTH; i += 820) {
    drawRoomDecor(i, t);
  }
}

// ── PLATTFORMEN (3D-Box-Optik) ─────────────────
function drawPlatforms() {
  const D = 9; // Tiefe der 3D-Seite in Pixeln

  // Hilfsfunktion: zeichnet die 3D-Seiten (Ost + Süd + Ecke)
  function draw3DSides(p, eastCol, southCol) {
    // Ost-Seite (rechts)
    ctx.fillStyle = eastCol;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w,     p.y);
    ctx.lineTo(p.x + p.w + D, p.y + D);
    ctx.lineTo(p.x + p.w + D, p.y + p.h + D);
    ctx.lineTo(p.x + p.w,     p.y + p.h);
    ctx.closePath(); ctx.fill();
    // Süd-Seite (unten)
    ctx.fillStyle = southCol;
    ctx.beginPath();
    ctx.moveTo(p.x,           p.y + p.h);
    ctx.lineTo(p.x + D,       p.y + p.h + D);
    ctx.lineTo(p.x + p.w + D, p.y + p.h + D);
    ctx.lineTo(p.x + p.w,     p.y + p.h);
    ctx.closePath(); ctx.fill();
  }

  for (const p of platforms) {
    if (p.type === 'floor') continue;

    ctx.save();
    // Globaler Schlagschatten für alle Plattformen
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur  = 10;
    ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 6;

    switch (p.type) {

      // ── Spielzeugklotz (rot) ─────────────────
      case 'toy': {
        draw3DSides(p, '#7a0d18', '#a81520');
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        // Oberfläche mit Gradient
        const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        g.addColorStop(0,   '#ff9db0');
        g.addColorStop(0.35,'#e63946');
        g.addColorStop(1,   '#be1826');
        ctx.fillStyle = g;
        roundRect(p.x, p.y, p.w, p.h, 4); ctx.fill();

        // Highlight-Linie oben links
        ctx.strokeStyle = 'rgba(255,230,235,0.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + 5, p.y + 2); ctx.lineTo(p.x + p.w - 5, p.y + 2); ctx.stroke();
        // Rand
        ctx.strokeStyle = '#a01020'; ctx.lineWidth = 1.5;
        roundRect(p.x, p.y, p.w, p.h, 4); ctx.stroke();
        // Stern-Aufkleber
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 4;
        drawStar(p.x + p.w / 2, p.y + p.h / 2, 4, 5, 3); ctx.fill();
        ctx.shadowBlur = 0;
        break;
      }

      // ── Bücherschrank (hoher Schrank mit Regalen) ────────────────
      case 'book': {
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        const FLOOR_Y  = 450;
        const bx       = p.x - 6;
        const bw       = p.w + 12;
        const bodyTop  = p.y + p.h;        // Unterseite der Standfläche
        const bodyH    = FLOOR_Y - bodyTop; // Höhe des Schrankkorpus bis Boden

        // ── Schrankkorpus (Holz, dunkler Gradient) ──────────────────
        const bodyG = ctx.createLinearGradient(bx, bodyTop, bx + bw, bodyTop);
        bodyG.addColorStop(0,   '#6b3f15');
        bodyG.addColorStop(0.5, '#4a2c12');
        bodyG.addColorStop(1,   '#3a2008');
        ctx.fillStyle = bodyG;
        ctx.fillRect(bx, bodyTop, bw, bodyH);

        // Seitenpaneele (dunkler)
        ctx.fillStyle = '#2e1a08';
        ctx.fillRect(bx,           bodyTop, 7, bodyH);
        ctx.fillRect(bx + bw - 7,  bodyTop, 7, bodyH);
        // Sockelleiste
        ctx.fillStyle = '#1e0f04';
        ctx.fillRect(bx - 3, FLOOR_Y - 10, bw + 6, 10);
        ctx.fillStyle = '#6b3f15';
        ctx.fillRect(bx - 3, FLOOR_Y - 10, bw + 6, 2);  // Highlight Sockel

        // ── Regalbretter + Bücher ────────────────────────────────────
        const bookColors = ['#e63946','#457b9d','#f4a261','#2a9d8f',
                            '#e9c46a','#6a4c93','#264653','#e76f51',
                            '#a8dadc','#f1faee','#ff6b6b','#ffd166'];
        const numShelves = Math.max(2, Math.floor(bodyH / 58));
        const shelfSpacing = bodyH / (numShelves + 1);

        for (let s = 0; s <= numShelves; s++) {
          const sy = Math.round(bodyTop + s * shelfSpacing);

          // Regalbrett
          ctx.fillStyle = '#1e0f04';
          ctx.fillRect(bx + 7, sy, bw - 14, 7);
          ctx.fillStyle = '#8a5520';
          ctx.fillRect(bx + 7, sy, bw - 14, 2);  // Highlight Brett

          // Bücher auf diesem Fach (nur zwischen Brett s und s+1)
          if (s < numShelves) {
            const fachH  = shelfSpacing - 7;
            const fachY  = sy + 7;
            let   bxi    = bx + 9;
            let   ci     = ((p.x / 50 | 0) * 3 + s * 7) % bookColors.length;

            while (bxi < bx + bw - 9) {
              // deterministisch: Breite aus Position ableiten
              const seed  = ((bxi * 13 + s * 31 + (p.x | 0)) & 0xFF);
              const bw2   = 8 + (seed % 11);
              if (bxi + bw2 > bx + bw - 9) break;

              // Buchkörper
              ctx.fillStyle = bookColors[ci % bookColors.length];
              ctx.fillRect(bxi, fachY, bw2, fachH - 3);

              // Buchrand rechts (Schatten)
              ctx.fillStyle = 'rgba(0,0,0,0.25)';
              ctx.fillRect(bxi + bw2 - 2, fachY, 2, fachH - 3);

              // Titelstreifen
              ctx.fillStyle = 'rgba(255,255,255,0.28)';
              ctx.fillRect(bxi + 2, fachY + 3, bw2 - 4, 3);

              bxi += bw2 + 2;
              ci++;
            }
          }
        }

        // ── 3D-Kante Schrank (rechts & unten) ───────────────────────
        draw3DSides(p, '#2e1a08', '#8a5520');

        // ── Oberseite / Standfläche (helles Holz) ───────────────────
        const topG = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        topG.addColorStop(0,   '#d4a054');
        topG.addColorStop(0.5, '#a97030');
        topG.addColorStop(1,   '#7a5018');
        ctx.fillStyle = topG;
        roundRect(p.x, p.y, p.w, p.h, 3); ctx.fill();

        // Holzmaserung oben
        ctx.strokeStyle = 'rgba(80,40,10,0.25)'; ctx.lineWidth = 1;
        for (let lx = p.x + 8; lx < p.x + p.w - 4; lx += 12) {
          ctx.beginPath();
          ctx.moveTo(lx, p.y + 2);
          ctx.lineTo(lx + 3, p.y + p.h - 2);
          ctx.stroke();
        }
        // Highlight-Linie oben
        ctx.strokeStyle = 'rgba(255,220,150,0.65)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + 5, p.y + 2); ctx.lineTo(p.x + p.w - 5, p.y + 2); ctx.stroke();
        // Rand
        ctx.strokeStyle = '#7a5018'; ctx.lineWidth = 1.5;
        roundRect(p.x, p.y, p.w, p.h, 3); ctx.stroke();
        break;
      }

      // ── LEGO-Steine (gelb) ───────────────────
      case 'block': {
        draw3DSides(p, '#8b6410', '#b08020');
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        g.addColorStop(0,   '#f8e070');
        g.addColorStop(0.5, '#e9c46a');
        g.addColorStop(1,   '#c8a030');
        ctx.fillStyle = g;
        roundRect(p.x, p.y, p.w, p.h, 3); ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,200,0.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + 5, p.y + 2); ctx.lineTo(p.x + p.w - 5, p.y + 2); ctx.stroke();
        ctx.strokeStyle = '#c8a030'; ctx.lineWidth = 1.5;
        roundRect(p.x, p.y, p.w, p.h, 3); ctx.stroke();

        // 3D-Noppen (LEGO-Studs)
        const studs = Math.max(1, Math.floor(p.w / 22));
        const spacing = p.w / studs;
        for (let s = 0; s < studs; s++) {
          const sx = p.x + spacing * s + spacing / 2;
          const sy = p.y - 5;
          // Stud-Seite
          ctx.fillStyle = '#b08020';
          ctx.beginPath(); ctx.ellipse(sx + 2, sy + 6, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
          // Stud-Oberfläche (radial gradient)
          const sg = ctx.createRadialGradient(sx - 2, sy - 2, 1, sx, sy, 7);
          sg.addColorStop(0, '#fff8b0');
          sg.addColorStop(1, '#e0b040');
          ctx.fillStyle = sg;
          ctx.beginPath(); ctx.ellipse(sx, sy, 6.5, 5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#b08020'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(sx, sy, 6.5, 5, 0, 0, Math.PI * 2); ctx.stroke();
        }
        break;
      }

      // ── Bett (Ziel-Plattform) ────────────────
      case 'bed': {
        draw3DSides(p, '#5a2e48', '#7a4860');
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

        // Bettrahmen
        const frameG = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        frameG.addColorStop(0, '#c99ab8');
        frameG.addColorStop(0.5,'#b5838d');
        frameG.addColorStop(1, '#8b5e6e');
        ctx.fillStyle = frameG;
        roundRect(p.x, p.y, p.w, p.h, 6); ctx.fill();

        // Bettdecke mit Gradient
        const coverG = ctx.createLinearGradient(p.x, p.y + 8, p.x + p.w, p.y + 8);
        coverG.addColorStop(0,   '#eec0ee');
        coverG.addColorStop(0.5, '#dda0dd');
        coverG.addColorStop(1,   '#cc88cc');
        ctx.fillStyle = coverG;
        roundRect(p.x + 4, p.y + 8, p.w - 8, p.h - 16, 4); ctx.fill();

        // Kissen (3D, radial highlight)
        const pillowG = ctx.createRadialGradient(p.x + 48, p.y + 16, 3, p.x + 48, p.y + 26, 42);
        pillowG.addColorStop(0, '#ffffff');
        pillowG.addColorStop(1, '#d0b8f0');
        ctx.fillStyle = pillowG;
        roundRect(p.x + 8, p.y + 10, 80, 36, 8); ctx.fill();
        ctx.strokeStyle = '#c0a0e0'; ctx.lineWidth = 1.5;
        roundRect(p.x + 8, p.y + 10, 80, 36, 8); ctx.stroke();
        // Kissenfalte
        ctx.strokeStyle = 'rgba(180,155,220,0.45)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x + 48, p.y + 13); ctx.lineTo(p.x + 48, p.y + 44); ctx.stroke();

        // Bettdecken-Sterne
        ctx.fillStyle = '#c77dff';
        ctx.shadowColor = '#a040ff'; ctx.shadowBlur = 5;
        drawStar(p.x + 150, p.y + 25, 5, 11, 5); ctx.fill();
        drawStar(p.x + 200, p.y + 16, 5, 7,  3); ctx.fill();
        drawStar(p.x + 230, p.y + 32, 5, 9,  4); ctx.fill();
        ctx.shadowBlur = 0;

        // Rahmen & Highlight
        ctx.strokeStyle = '#5a2e48'; ctx.lineWidth = 2.5;
        roundRect(p.x, p.y, p.w, p.h, 6); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,220,255,0.45)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + 8, p.y + 4); ctx.lineTo(p.x + p.w - 8, p.y + 4); ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }
}

// ── STERNE (Collectibles) ──────────────────────
function drawCollectibles() {
  const t = Date.now() / 1000;
  for (const c of collectibles) {
    if (c.collected) continue;
    const bob = Math.sin(t * 3 + c.phase) * 3;
    ctx.save();
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffd700';
    drawStar(c.x + c.w / 2, c.y + c.h / 2 + bob, 5, 9, 4);
    ctx.fill();
    ctx.fillStyle = '#fff9a0';
    drawStar(c.x + c.w / 2, c.y + c.h / 2 + bob, 5, 5, 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── ZIEL-FLAGGE ────────────────────────────────
function drawGoalFlag() {
  const t = Date.now() / 1000;
  const fx = goal.x + goal.w / 2;
  // Mast
  ctx.fillStyle = '#aaa';
  ctx.fillRect(fx - 2, goal.y - 25, 4, goal.h + 20);
  // Wehende Flagge
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(fx + 2, goal.y - 20);
  ctx.quadraticCurveTo(fx + 30 + Math.sin(t * 5) * 6, goal.y - 5,
                        fx + 2,  goal.y + 12);
  ctx.closePath(); ctx.fill();
  // Glanz-Aura (pulsierend)
  const glow = 0.3 + Math.sin(t * 3) * 0.15;
  ctx.strokeStyle = `rgba(255,215,0,${glow})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(fx, goal.y + goal.h / 2, 35, 0, Math.PI * 2);
  ctx.stroke();
  // "ZIEL" Label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('ZIEL!', fx, goal.y + goal.h + 14);
  ctx.textAlign = 'left';
}

// ── GEGNER ────────────────────────────────────
function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) {
      // Plattgedrückter Gegner (flache Silhouette)
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = e.type === 'doll' ? '#ff69b4' : '#0288d1';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w / 2, e.y + e.h - 5, e.w / 2, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w / 2, e.y + e.h - 3, e.w / 2 - 2, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
      continue;
    }
    const flip = e.vx < 0; // Puppe/Auto spiegeln je nach Laufrichtung
    ctx.save();
    if (flip) {
      ctx.translate(e.x + e.w, e.y); ctx.scale(-1, 1);
    } else {
      ctx.translate(e.x, e.y);
    }

    if (e.type === 'doll') {
      // ── Puppe (mit 3D-Shading) ────────────
      // Schatten unter Puppe
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(e.w / 2 + 2, e.h + 2, e.w / 2 - 2, 5, 0, 0, Math.PI * 2); ctx.fill();

      // Kleid (Gradient)
      const dressG = ctx.createLinearGradient(0, 20, e.w, e.h);
      dressG.addColorStop(0, '#ff9dd4'); dressG.addColorStop(1, '#d4338a');
      ctx.fillStyle = dressG;
      ctx.beginPath();
      ctx.moveTo(8, 20); ctx.lineTo(2, e.h); ctx.lineTo(e.w - 2, e.h); ctx.lineTo(e.w - 8, 20);
      ctx.closePath(); ctx.fill();
      // Kleider-Glanz
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.moveTo(10, 22); ctx.lineTo(6, e.h - 4); ctx.lineTo(16, e.h - 4); ctx.lineTo(18, 22);
      ctx.closePath(); ctx.fill();

      // Oberteil
      const topG = ctx.createLinearGradient(9, 18, e.w - 9, 32);
      topG.addColorStop(0, '#ffd0dc'); topG.addColorStop(1, '#ffb3ba');
      ctx.fillStyle = topG;
      ctx.fillRect(9, 18, e.w - 18, 14);

      // Kopf (radial gradient = rund + Licht)
      const headG = ctx.createRadialGradient(e.w/2 - 3, 8, 2, e.w/2, 12, 13);
      headG.addColorStop(0, '#fff0e0'); headG.addColorStop(1, '#d4a070');
      ctx.fillStyle = headG;
      ctx.beginPath(); ctx.arc(e.w / 2, 12, 12, 0, Math.PI * 2); ctx.fill();

      // Haare
      ctx.fillStyle = '#6b3010';
      ctx.beginPath(); ctx.arc(e.w / 2, 8, 12, Math.PI, 0); ctx.fill();
      ctx.fillRect(4, 8, 6, 10); ctx.fillRect(e.w - 10, 8, 6, 10);
      // Haar-Glanz
      ctx.fillStyle = 'rgba(255,180,120,0.3)';
      ctx.beginPath(); ctx.arc(e.w / 2 - 2, 6, 6, Math.PI, 0); ctx.fill();

      // Augen
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.arc(e.w / 2 - 4, 12, 2.2, 0, Math.PI * 2);
      ctx.arc(e.w / 2 + 4, 12, 2.2, 0, Math.PI * 2);
      ctx.fill();
      // Augen-Glanz
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.w / 2 - 3, 11, 0.8, 0, Math.PI * 2);
      ctx.arc(e.w / 2 + 5, 11, 0.8, 0, Math.PI * 2);
      ctx.fill();
      // Mund
      ctx.strokeStyle = '#aa3355'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(e.w / 2, 15, 3, 0.2, Math.PI - 0.2); ctx.stroke();
      // Wangen
      ctx.fillStyle = 'rgba(255,120,120,0.3)';
      ctx.beginPath(); ctx.ellipse(e.w/2 - 6, 15, 4, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(e.w/2 + 6, 15, 4, 3, 0, 0, Math.PI*2); ctx.fill();

      // Beine
      const legG = ctx.createLinearGradient(9, e.h - 10, e.w - 9, e.h);
      legG.addColorStop(0, '#ffe8cc'); legG.addColorStop(1, '#d4a070');
      ctx.fillStyle = legG;
      ctx.fillRect(9, e.h - 10, 7, 10);
      ctx.fillRect(e.w - 16, e.h - 10, 7, 10);
      // Schuhe (3D)
      ctx.fillStyle = '#a02020';
      ctx.fillRect(7,  e.h - 4, 11, 4);
      ctx.fillRect(e.w - 18, e.h - 4, 11, 4);
      ctx.fillStyle = 'rgba(255,100,100,0.4)';
      ctx.fillRect(8, e.h - 4, 4, 2);
      ctx.fillRect(e.w - 17, e.h - 4, 4, 2);

    } else {
      // ── Spielzeugauto (mit 3D-Shading) ────
      // Schatten
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(e.w / 2 + 2, e.h + 2, e.w / 2, 4, 0, 0, Math.PI * 2); ctx.fill();

      // Räder (3D)
      for (const wx of [9, e.w - 9]) {
        // Reifen-Schatten
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(wx + 1, e.h - 3, 7, 0, Math.PI * 2); ctx.fill();
        // Reifen
        ctx.fillStyle = '#2a2a2a';
        ctx.beginPath(); ctx.arc(wx, e.h - 4, 7, 0, Math.PI * 2); ctx.fill();
        // Felge
        const wheelG = ctx.createRadialGradient(wx - 2, e.h - 6, 1, wx, e.h - 4, 4);
        wheelG.addColorStop(0, '#999'); wheelG.addColorStop(1, '#444');
        ctx.fillStyle = wheelG;
        ctx.beginPath(); ctx.arc(wx, e.h - 4, 4, 0, Math.PI * 2); ctx.fill();
        // Felgen-Glanz
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.arc(wx - 1, e.h - 5, 1.5, 0, Math.PI * 2); ctx.fill();
      }

      // Karosserie Seite (3D-Tiefe)
      ctx.fillStyle = '#015f94';
      ctx.fillRect(1, e.h - 17, e.w - 1, 3);

      // Karosserie unten (Gradient)
      const bodyLowG = ctx.createLinearGradient(0, e.h - 18, 0, e.h - 4);
      bodyLowG.addColorStop(0, '#29b6f6'); bodyLowG.addColorStop(1, '#0277bd');
      ctx.fillStyle = bodyLowG;
      roundRect(0, e.h - 18, e.w, 14, 3); ctx.fill();

      // Karosserie oben (Gradient)
      const bodyTopG = ctx.createLinearGradient(5, e.h - 32, e.w - 5, e.h - 18);
      bodyTopG.addColorStop(0, '#4fc3f7'); bodyTopG.addColorStop(1, '#0277bd');
      ctx.fillStyle = bodyTopG;
      roundRect(5, e.h - 32, e.w - 10, 16, 4); ctx.fill();

      // Karosserie-Glanz
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(7, e.h - 30, e.w - 20, 6, 2); ctx.fill();

      // Fenster (Gradient)
      const winG = ctx.createLinearGradient(8, e.h - 30, 8, e.h - 20);
      winG.addColorStop(0, '#e0f7ff'); winG.addColorStop(1, '#80d8f0');
      ctx.fillStyle = winG;
      ctx.fillRect(8,  e.h - 30, 11, 10);
      ctx.fillRect(e.w - 19, e.h - 30, 11, 10);
      // Fensterrahmen
      ctx.strokeStyle = '#015f94'; ctx.lineWidth = 1;
      ctx.strokeRect(8, e.h - 30, 11, 10);
      ctx.strokeRect(e.w - 19, e.h - 30, 11, 10);

      // Scheinwerfer (leuchtend)
      const hlG = ctx.createRadialGradient(e.w - 3, e.h - 12, 0, e.w - 3, e.h - 12, 4);
      hlG.addColorStop(0, '#fffde0'); hlG.addColorStop(1, 'rgba(255,240,100,0)');
      ctx.fillStyle = hlG;
      ctx.beginPath(); ctx.arc(e.w - 3, e.h - 12, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff176';
      ctx.beginPath(); ctx.arc(e.w - 3, e.h - 12, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── ENERGY DRINKS ──────────────────────────────
function drawEnergyDrinks() {
  const t = Date.now() / 1000;
  for (const d of energyDrinks) {
    if (d.collected) continue;
    const bob = Math.sin(t * 4 + d.phase) * 3;
    const dx = d.x, dy = d.y + bob;

    ctx.save();
    // Dose – Körper
    const grad = ctx.createLinearGradient(dx, dy, dx + d.w, dy);
    grad.addColorStop(0,   '#00c0ff');
    grad.addColorStop(0.4, '#0080ff');
    grad.addColorStop(1,   '#004fc4');
    ctx.fillStyle = grad;
    roundRect(dx, dy + 4, d.w, d.h - 8, 4); ctx.fill();

    // Deckel & Boden
    ctx.fillStyle = '#aad4ff';
    roundRect(dx + 2, dy,           d.w - 4, 6, 3); ctx.fill();
    roundRect(dx + 2, dy + d.h - 6, d.w - 4, 6, 3); ctx.fill();

    // Blitz-Symbol
    ctx.fillStyle = '#ffe000';
    ctx.shadowColor = '#ffe000'; ctx.shadowBlur = 6;
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
    ctx.fillText('⚡', dx + d.w / 2, dy + d.h / 2 + 5);
    ctx.shadowBlur = 0;

    // Leuchtender Rand
    ctx.strokeStyle = 'rgba(100,200,255,0.7)'; ctx.lineWidth = 1.5;
    roundRect(dx, dy + 4, d.w, d.h - 8, 4); ctx.stroke();

    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// ── SPIELER (Paul) ─────────────────────────────
function drawPlayer() {
  // Blinken während Unverwundbarkeit
  if (player.invincible && Math.floor(Date.now() / 80) % 2 === 0) return;

  ctx.save();

  // Im Big-Zustand: leicht bläulicher Schimmer
  if (player.big) {
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur  = 12 + Math.sin(Date.now() / 150) * 4;
  }

  if (!player.facingRight) {
    ctx.translate(player.x + player.w, player.y);
    ctx.scale(-1, 1);
    ctx.drawImage(paulImg, 0, 0, player.w, player.h);
  } else {
    ctx.drawImage(paulImg, player.x, player.y, player.w, player.h);
  }

  // Timer-Balken wenn Big (blinkt wenn fast vorbei)
  if (player.big) {
    ctx.shadowBlur = 0;
    const barW   = player.w;
    const prog   = player.bigTimer / BIG_DURATION;
    const blink  = player.bigTimer < 120 && Math.floor(Date.now() / 120) % 2 === 0;
    if (!blink) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(player.x, player.y - 8, barW, 5);
      ctx.fillStyle = prog > 0.3 ? '#4fc3f7' : '#ff6b6b';
      ctx.fillRect(player.x, player.y - 8, barW * prog, 5);
    }
  }

  ctx.restore();
}

// ── FALLTÜR ────────────────────────────────────
function drawTrapdoor() {
  if (trapdoor.state === 'open') return;
  const tx = trapdoor.x + trapdoor.shakeOff;
  const ty = trapdoor.y;
  const hw = trapdoor.w / 2;

  ctx.save();
  if (trapdoor.state === 'closed' || trapdoor.state === 'shaking') {
    // Warnstreifen (gelb-schwarz)
    ctx.save();
    ctx.beginPath();
    ctx.rect(tx, ty, trapdoor.w, trapdoor.h);
    ctx.clip();
    const stripeW = 18;
    for (let s = -trapdoor.h; s < trapdoor.w + trapdoor.h; s += stripeW * 2) {
      ctx.fillStyle = '#f5c900';
      ctx.fillRect(tx + s, ty, stripeW, trapdoor.h);
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(tx + s + stripeW, ty, stripeW, trapdoor.h);
    }
    ctx.restore();
    // Rand
    ctx.strokeStyle = trapdoor.state === 'shaking' ? '#ff4444' : '#888';
    ctx.lineWidth = 3;
    ctx.strokeRect(tx, ty, trapdoor.w, trapdoor.h);
    // Mittellinie
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx + hw, ty); ctx.lineTo(tx + hw, ty + trapdoor.h); ctx.stroke();
    // ⚠ Schild
    if (trapdoor.state === 'shaking') {
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
      ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
      ctx.fillText('⚠', tx + hw, ty + trapdoor.h / 2 + 7);
      ctx.shadowBlur = 0;
    }
  } else if (trapdoor.state === 'falling') {
    // Linke Hälfte fällt nach links-unten
    ctx.save();
    ctx.translate(tx, ty + trapdoor.leftDrop);
    ctx.rotate(-trapdoor.leftDrop * 0.02);
    ctx.fillStyle = '#888';
    ctx.fillRect(0, 0, hw, trapdoor.h);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, hw, trapdoor.h);
    ctx.restore();
    // Rechte Hälfte fällt nach rechts-unten
    ctx.save();
    ctx.translate(tx + hw, ty + trapdoor.rightDrop);
    ctx.rotate(trapdoor.rightDrop * 0.02);
    ctx.fillStyle = '#888';
    ctx.fillRect(0, 0, hw, trapdoor.h);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, hw, trapdoor.h);
    ctx.restore();
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

// ── UNTERIRDISCHER RAUM ────────────────────────
function drawRoom() {
  // Dunkler Hintergrund
  ctx.fillStyle = '#0d0808';
  ctx.fillRect(ROOM.x - 28, ROOM.y, ROOM.w + 56, ROOM.floorY - ROOM.y + 30);

  // Steinmauer-Textur (Wände)
  const stoneColors = ['#2a1e14', '#3a2a1c', '#2e2318'];
  const brickH = 22, brickW = 48;
  for (let row = 0; row * brickH < ROOM.floorY - ROOM.y + 30; row++) {
    const offset = (row % 2) * (brickW / 2);
    for (let col = -1; col < (ROOM.w + 56) / brickW + 1; col++) {
      const bx = ROOM.x - 28 + col * brickW - offset;
      const by = ROOM.y + row * brickH;
      ctx.fillStyle = stoneColors[Math.abs(row * 7 + col * 3) % 3];
      ctx.fillRect(bx + 1, by + 1, brickW - 2, brickH - 2);
      ctx.strokeStyle = '#1a1008'; ctx.lineWidth = 1;
      ctx.strokeRect(bx + 1, by + 1, brickW - 2, brickH - 2);
    }
  }

  // Linke + rechte Wand (dunkler Overlay)
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(ROOM.x - 28, ROOM.y, 28, ROOM.floorY - ROOM.y + 30);
  ctx.fillRect(ROOM.x + ROOM.w, ROOM.y, 28, ROOM.floorY - ROOM.y + 30);

  // Boden (Stein-Platten)
  for (let bx = ROOM.x - 28; bx < ROOM.x + ROOM.w + 28; bx += 56) {
    const plankG = ctx.createLinearGradient(0, ROOM.floorY, 0, ROOM.floorY + 30);
    plankG.addColorStop(0, '#5a4030'); plankG.addColorStop(1, '#2a1808');
    ctx.fillStyle = plankG;
    ctx.fillRect(bx + 1, ROOM.floorY, 54, 30);
    ctx.strokeStyle = '#1a0808'; ctx.lineWidth = 1.5;
    ctx.strokeRect(bx + 1, ROOM.floorY, 54, 30);
    ctx.fillStyle = 'rgba(255,180,100,0.07)';
    ctx.fillRect(bx + 2, ROOM.floorY, 54, 4);
  }

  // Decke (oben an der Öffnung) – Rand
  ctx.fillStyle = '#2a1808';
  ctx.fillRect(ROOM.x - 28, ROOM.y, ROOM.w + 56, 6);

  // Fackeln an den Wänden (animiert)
  const t = Date.now() / 1000;
  for (const fx of [ROOM.x + 30, ROOM.x + ROOM.w - 50]) {
    const fy = ROOM.y + 50;
    // Halterung
    ctx.fillStyle = '#5a4030';
    ctx.fillRect(fx - 5, fy, 10, 18);
    // Flamme (animiert)
    const flicker = Math.sin(t * 8 + fx) * 3;
    const flameG = ctx.createRadialGradient(fx, fy - 8, 2, fx, fy - 5, 14 + flicker);
    flameG.addColorStop(0, 'rgba(255,255,150,0.95)');
    flameG.addColorStop(0.5, 'rgba(255,120,0,0.8)');
    flameG.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = flameG;
    ctx.beginPath(); ctx.ellipse(fx, fy - 5, 8 + flicker * 0.3, 14 + flicker, 0, 0, Math.PI * 2);
    ctx.fill();
    // Leuchtring
    const glowG = ctx.createRadialGradient(fx, fy - 5, 5, fx, fy, 35);
    glowG.addColorStop(0, 'rgba(255,150,50,0.15)');
    glowG.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = glowG;
    ctx.beginPath(); ctx.arc(fx, fy - 5, 35, 0, Math.PI * 2); ctx.fill();
  }

  // "MINIBOSS"-Schild oben
  if (!boss || !boss.dead) {
    ctx.fillStyle = 'rgba(180,0,0,0.8)';
    roundRect(ROOM.x + ROOM.w / 2 - 55, ROOM.y + 12, 110, 22, 4); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
    ctx.fillText('⚔ MINIBOSS-RAUM ⚔', ROOM.x + ROOM.w / 2, ROOM.y + 28);
    ctx.textAlign = 'left';
  }
}

// ── MINIBOSS (Teddybär) ────────────────────────
function drawBoss() {
  if (!boss || boss.dead) return;
  const t = Date.now() / 1000;
  // Blinken bei Unverwundbarkeit
  if (boss.invincible && Math.floor(t * 8) % 2 === 0) return;

  const bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
  ctx.save();

  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(bx + bw/2 + 3, by + bh + 3, bw/2, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Beine (3D)
  ctx.fillStyle = '#6b3010';
  ctx.fillRect(bx + 10, by + bh - 22, 18, 22);
  ctx.fillRect(bx + bw - 28, by + bh - 22, 18, 22);
  ctx.fillStyle = '#4a2008'; // Schattenseite
  ctx.fillRect(bx + 22, by + bh - 22, 6, 22);
  ctx.fillRect(bx + bw - 22, by + bh - 22, 6, 22);

  // Körper (radial gradient)
  const bodyG = ctx.createRadialGradient(bx + bw/2 - 8, by + bh*0.45, 5, bx + bw/2, by + bh*0.55, bw * 0.48);
  bodyG.addColorStop(0, '#c87040'); bodyG.addColorStop(1, '#6b3010');
  ctx.fillStyle = bodyG;
  ctx.beginPath(); ctx.arc(bx + bw/2, by + bh * 0.6, bw * 0.42, 0, Math.PI * 2); ctx.fill();

  // Bauch (heller Fleck)
  const bellyG = ctx.createRadialGradient(bx + bw/2, by + bh * 0.6, 2, bx + bw/2, by + bh * 0.62, bw * 0.26);
  bellyG.addColorStop(0, '#e8c090'); bellyG.addColorStop(1, 'rgba(200,140,60,0)');
  ctx.fillStyle = bellyG;
  ctx.beginPath(); ctx.arc(bx + bw/2, by + bh * 0.62, bw * 0.26, 0, Math.PI * 2); ctx.fill();

  // Arme
  ctx.fillStyle = '#7a3a14';
  ctx.save(); ctx.translate(bx + 5, by + bh*0.38); ctx.rotate(-0.3);
  ctx.fillRect(0, 0, 14, 30); ctx.restore();
  ctx.save(); ctx.translate(bx + bw - 19, by + bh*0.38); ctx.rotate(0.3);
  ctx.fillRect(0, 0, 14, 30); ctx.restore();

  // Ohren
  ctx.fillStyle = '#6b3010';
  ctx.beginPath(); ctx.arc(bx + bw/2 - 25, by + 10, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + bw/2 + 25, by + 10, 14, 0, Math.PI * 2); ctx.fill();
  const earG1 = ctx.createRadialGradient(bx + bw/2 - 25, by + 8, 2, bx + bw/2 - 25, by + 10, 9);
  earG1.addColorStop(0, '#e09060'); earG1.addColorStop(1, '#a05030');
  ctx.fillStyle = earG1;
  ctx.beginPath(); ctx.arc(bx + bw/2 - 25, by + 10, 8, 0, Math.PI * 2); ctx.fill();
  const earG2 = ctx.createRadialGradient(bx + bw/2 + 25, by + 8, 2, bx + bw/2 + 25, by + 10, 9);
  earG2.addColorStop(0, '#e09060'); earG2.addColorStop(1, '#a05030');
  ctx.fillStyle = earG2;
  ctx.beginPath(); ctx.arc(bx + bw/2 + 25, by + 10, 8, 0, Math.PI * 2); ctx.fill();

  // Kopf (radial gradient)
  const headG = ctx.createRadialGradient(bx + bw/2 - 8, by + 18, 4, bx + bw/2, by + 26, 28);
  headG.addColorStop(0, '#d08040'); headG.addColorStop(1, '#7a3a14');
  ctx.fillStyle = headG;
  ctx.beginPath(); ctx.arc(bx + bw/2, by + 28, 26, 0, Math.PI * 2); ctx.fill();

  // Schnauze
  const snoutG = ctx.createRadialGradient(bx + bw/2, by + 37, 2, bx + bw/2, by + 38, 12);
  snoutG.addColorStop(0, '#e8b080'); snoutG.addColorStop(1, '#c08050');
  ctx.fillStyle = snoutG;
  ctx.beginPath(); ctx.ellipse(bx + bw/2, by + 38, 13, 9, 0, 0, Math.PI * 2); ctx.fill();

  // Nase
  ctx.fillStyle = '#1a0800';
  ctx.beginPath(); ctx.ellipse(bx + bw/2, by + 33, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,100,50,0.3)';
  ctx.beginPath(); ctx.ellipse(bx + bw/2 - 2, by + 31, 3, 2, 0, 0, Math.PI * 2); ctx.fill();

  // Wütende Augenbrauen
  ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx + bw/2 - 18, by + 16); ctx.lineTo(bx + bw/2 - 6, by + 21); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + bw/2 + 18, by + 16); ctx.lineTo(bx + bw/2 + 6, by + 21); ctx.stroke();

  // Augen (rot glühend – wütend)
  const eyeRed = ctx.createRadialGradient(bx + bw/2 - 9, by + 25, 1, bx + bw/2 - 9, by + 25, 6);
  eyeRed.addColorStop(0, '#ff4444'); eyeRed.addColorStop(1, '#880000');
  ctx.fillStyle = eyeRed;
  ctx.beginPath(); ctx.arc(bx + bw/2 - 9, by + 25, 5, 0, Math.PI * 2); ctx.fill();
  const eyeRed2 = ctx.createRadialGradient(bx + bw/2 + 9, by + 25, 1, bx + bw/2 + 9, by + 25, 6);
  eyeRed2.addColorStop(0, '#ff4444'); eyeRed2.addColorStop(1, '#880000');
  ctx.fillStyle = eyeRed2;
  ctx.beginPath(); ctx.arc(bx + bw/2 + 9, by + 25, 5, 0, Math.PI * 2); ctx.fill();
  // Augen-Glanz
  ctx.fillStyle = 'rgba(255,200,200,0.7)';
  ctx.beginPath(); ctx.arc(bx + bw/2 - 7, by + 23, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx + bw/2 + 11, by + 23, 1.5, 0, Math.PI * 2); ctx.fill();

  // Mund (böses Grinsen)
  ctx.strokeStyle = '#3a1000'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(bx + bw/2, by + 40, 8, 0.15, Math.PI - 0.15, true); ctx.stroke();
  // Zähne
  ctx.fillStyle = '#fffde7';
  ctx.fillRect(bx + bw/2 - 8, by + 38, 5, 5);
  ctx.fillRect(bx + bw/2 + 3, by + 38, 5, 5);

  // Health-Bar
  const barW = bw + 20, barX = bx - 10, barY = by - 20;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(barX, barY, barW, 12, 3); ctx.fill();
  const hpPct = boss.health / boss.maxHealth;
  const hpColor = hpPct > 0.6 ? '#4caf50' : hpPct > 0.3 ? '#ff9800' : '#f44336';
  ctx.fillStyle = hpColor;
  roundRect(barX, barY, barW * hpPct, 12, 3); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  roundRect(barX, barY, barW, 12, 3); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
  ctx.fillText('❤ BOSS ❤', bx + bw/2, barY - 3);
  ctx.textAlign = 'left';

  ctx.restore();
}

// ── FEDER (Ausgang) ────────────────────────────
function drawExitSpring() {
  if (!exitSpring.active) return;
  const t = Date.now() / 1000;
  const sx = exitSpring.x, sy = exitSpring.y;
  const sw = exitSpring.w, sh = exitSpring.h;
  const bounce = Math.abs(Math.sin(t * 5)) * 4;

  ctx.save();
  ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 12 + bounce;

  // Federwindungen
  ctx.strokeStyle = '#00cc66'; ctx.lineWidth = 4;
  for (let i = 0; i < 4; i++) {
    const wy = sy + sh - 4 - i * (sh / 4);
    ctx.beginPath();
    ctx.moveTo(sx + 4, wy);
    ctx.bezierCurveTo(sx + 4, wy - 4, sx + sw - 4, wy - 4, sx + sw - 4, wy - sh/4 + 2);
    ctx.stroke();
  }
  // Basis-Platte
  const plateG = ctx.createLinearGradient(sx, sy + sh - 6, sx, sy + sh);
  plateG.addColorStop(0, '#00dd77'); plateG.addColorStop(1, '#008844');
  ctx.fillStyle = plateG;
  roundRect(sx - 4, sy + sh - 6, sw + 8, 6, 2); ctx.fill();

  // Pfeil nach oben (animiert)
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${16 + bounce}px Arial`; ctx.textAlign = 'center';
  ctx.fillText('↑', sx + sw/2, sy - 4 - bounce);
  ctx.textAlign = 'left';

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─────────────────────────────────────────────
// 13. HUD (Heads-Up-Display)
// ─────────────────────────────────────────────
function drawHUD() {
  // Halbtransparente Leiste oben
  ctx.fillStyle = 'rgba(10,10,30,0.6)';
  ctx.fillRect(0, 0, canvas.width, 48);

  // Sterne-Score
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 6;
  ctx.font = 'bold 22px Arial';
  ctx.fillText('⭐ ' + player.score, 16, 32);
  ctx.shadowBlur = 0;

  // Leben (Herzen)
  ctx.font = '22px Arial';
  for (let i = 0; i < player.lives; i++) {
    ctx.fillText('❤️', canvas.width - 38 - i * 34, 32);
  }

  // Fortschrittsbalken (Mitte)
  const barW = 200;
  const barX = (canvas.width - barW) / 2;
  const prog = Math.min(player.x / (WORLD_WIDTH - 200), 1);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(barX, 12, barW, 10, 5); ctx.fill();
  ctx.fillStyle = '#4fc3f7';
  roundRect(barX, 12, barW * prog, 10, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  roundRect(barX, 12, barW, 10, 5); ctx.stroke();
  // Mini-Flagge am Ende
  ctx.fillStyle = '#e63946';
  ctx.fillText('🏁', barX + barW - 2, 30);

  // ── Boss-Hinweis (wenn Ziel betreten ohne Boss zu besiegen) ──
  if (showBossHint > 0) {
    showBossHint--;
    const alpha = Math.min(1, showBossHint / 30); // sanftes Ausblenden
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(canvas.width / 2 - 180, canvas.height / 2 - 28, 360, 56, 8);
    ctx.fill();
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
    ctx.fillText('⚔ Besiege zuerst den Boss! ⚔', canvas.width / 2, canvas.height / 2 + 8);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.textAlign = 'left';
  }
}

// ─────────────────────────────────────────────
// 14. OVERLAY-BILDSCHIRME
// ─────────────────────────────────────────────
function overlayBg(alpha) {
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawStartScreen() {
  overlayBg(0.72);
  const t = Date.now() / 1000;

  // Titel
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 38px Arial';
  ctx.fillText("Paul's Schlafzimmer-Abenteuer", canvas.width / 2, 150);
  ctx.shadowBlur = 0;

  // Untertitel
  ctx.fillStyle = '#ccc';
  ctx.font = '18px Arial';
  ctx.fillText('Sammle alle ⭐ Sterne und erreiche das Bett!', canvas.width / 2, 195);

  // Steuerung
  ctx.fillStyle = '#aaa';
  ctx.font = '16px Arial';
  ctx.fillText('← → oder A/D = Bewegen', canvas.width / 2, 235);
  ctx.fillText('↑ / W / Leertaste = Springen', canvas.width / 2, 260);
  ctx.fillText('Puppen & Autos = Gefahr  –  3 Leben', canvas.width / 2, 285);

  // Pulsierender Start-Button
  const pulse = 0.92 + Math.sin(t * 3) * 0.08;
  ctx.save();
  ctx.translate(canvas.width / 2, 350);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#4fc3f7';
  ctx.shadowColor = '#4fc3f7'; ctx.shadowBlur = 14;
  ctx.font = 'bold 26px Arial';
  ctx.fillText('▶  LEERTASTE ZUM STARTEN', 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;

  // Paul-Sprite als Preview
  if (paulImg.complete && paulImg.naturalWidth > 0) {
    ctx.drawImage(paulImg, canvas.width / 2 - 25, 380, 50, 72);
  }
  ctx.textAlign = 'left';
}

function drawGameOverScreen() {
  overlayBg(0.78);
  const t = Date.now() / 1000;

  ctx.textAlign = 'center';
  ctx.shadowColor = '#e63946'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#e63946';
  ctx.font = 'bold 56px Arial';
  ctx.fillText('GAME OVER', canvas.width / 2, 195);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#eee';
  ctx.font = '24px Arial';
  ctx.fillText('Punkte: ' + player.score, canvas.width / 2, 255);
  ctx.fillStyle = '#aaa';
  ctx.font = '18px Arial';
  ctx.fillText('Nicht aufgeben – Paul schafft das!', canvas.width / 2, 295);

  const pulse = 0.92 + Math.sin(t * 3) * 0.08;
  ctx.save();
  ctx.translate(canvas.width / 2, 360);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
  ctx.font = 'bold 24px Arial';
  ctx.fillText('▶  LEERTASTE = NOCHMAL SPIELEN', 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function drawWinScreen() {
  overlayBg(0.78);
  const t = Date.now() / 1000;

  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 28;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 50px Arial';
  ctx.fillText('🎉  GEWONNEN!  🎉', canvas.width / 2, 185);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#eee';
  ctx.font = '24px Arial';
  ctx.fillText('Punktestand: ' + player.score, canvas.width / 2, 245);
  ctx.fillStyle = '#ccc';
  ctx.font = '20px Arial';
  ctx.fillText('Paul hat das Schlafzimmer gemeistert!', canvas.width / 2, 285);
  ctx.fillText('Alle Hindernisse überwunden ✓', canvas.width / 2, 315);

  // Sterne-Regen (Dekoration)
  ctx.fillStyle = '#ffd700';
  for (let i = 0; i < 8; i++) {
    const sx = 100 + i * 86;
    const sy = 350 + Math.sin(t * 2 + i) * 12;
    drawStar(sx, sy, 5, 10, 5); ctx.fill();
  }

  const pulse = 0.92 + Math.sin(t * 3) * 0.08;
  ctx.save();
  ctx.translate(canvas.width / 2, 400);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#4fc3f7';
  ctx.shadowColor = '#4fc3f7'; ctx.shadowBlur = 12;
  ctx.font = 'bold 22px Arial';
  ctx.fillText('▶  LEERTASTE = NOCHMAL SPIELEN', 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

// ─────────────────────────────────────────────
// 15. GAME LOOP
// ─────────────────────────────────────────────
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Starten sobald Paul-Bild geladen ist (Fallback falls Fehler)
paulImg.onload  = gameLoop;
paulImg.onerror = () => { console.warn('Paul.png nicht geladen – Fallback aktiv'); gameLoop(); };

// Falls das Bild schon gecacht ist:
if (paulImg.complete) gameLoop();
</script>
